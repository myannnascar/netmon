name: Build netmon (APK)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: 'netmon'

      - name: Preparation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd

      - name: Download and Setup SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/openwrt-sdk-25.12.3-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget -qO sdk.tar.zst $SDK_URL
          mkdir sdk && tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          
          cd sdk
          # 手动建立软链接到自定义目录
          mkdir -p package/custom
          ln -s ../../../netmon/netmon-core package/custom/netmon-core
          ln -s ../../../netmon/luci-app-netmon package/custom/luci-app-netmon
          
          # 更新并安装所有 feeds。这一步会将 libubox 等基础库的编译规则拉取到本地
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Compile Dependencies and Plugin
        run: |
          cd sdk
          # 生成 .config 文件，这一步会根据你的 Makefile DEPENDS 自动选中依赖库
          make defconfig || true
          
          # 核心修复：强制编译依赖项。这不会编译整个系统，
          # 而是将 libubox, libubus 等头文件安装到 staging_dir 中
          echo "Preparing build environment for dependencies..."
          make package/libubox/compile V=s -j$(nproc)
          make package/libubus/compile V=s -j$(nproc)
          make package/libjson-c/compile V=s -j$(nproc)
          
          echo "Starting compilation for netmon-core..."
          # 现在环境已经就绪，再次尝试编译插件
          make package/custom/netmon-core/compile V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netmon-apk-v25.12.3
          path: sdk/bin/**/*.apk
