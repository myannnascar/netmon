name: Build and Release netmon (APK)

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*' 
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    #
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            sdk_url: "https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/openwrt-sdk-25.12.3-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          - arch: armv8
            sdk_url: "https://downloads.openwrt.org/releases/25.12.3/targets/armsr/armv8/openwrt-sdk-25.12.3-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: 'netmon'

      - name: Preparation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd

      - name: Download and Setup SDK
        run: |
          wget -qO sdk.tar.zst "${{ matrix.sdk_url }}"
          mkdir sdk && tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          
          cd sdk
          mkdir -p package/custom
          ln -s ../../../netmon/netmon-core package/custom/netmon-core
          ln -s ../../../netmon/luci-app-netmon package/custom/luci-app-netmon
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Compile Packages
        run: |
          cd sdk
          make defconfig || true
          echo "Compiling netmon-core..."
          make package/custom/netmon-core/compile V=s
          echo "Compiling luci-app-netmon..."
          make package/custom/luci-app-netmon/compile V=s

      - name: Prepare Artifacts (Refined)
        run: |
          mkdir -p bin_out
          find sdk/bin/packages/ -type f -regextype posix-extended -regex ".*(netmon-core|luci-app-netmon|libubox|libblobmsg-json).*\.apk" | while read file; do
            filename=$(basename "$file")
            if [[ ! "$filename" == *"luci-i18n-"* ]]; then
              new_name="${filename%.apk}_${{ matrix.arch }}.apk"
              cp "$file" "bin_out/$new_name"
            fi
          done
          
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            find sdk/bin/packages/ -name "luci-i18n-netmon-*.apk" -exec cp {} bin_out/ \;
          fi
          
          echo "Final Artifacts List:"
          ls -lh bin_out/

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netmon-apk-${{ matrix.arch }}
          path: bin_out/ 

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') 
        with:
          files: bin_out/*.apk 
          generate_release_notes: ${{ matrix.arch == 'x86_64' }}
          #
          append_body: true
