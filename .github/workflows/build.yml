name: Build netmon (APK)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: 'netmon-repo' 

      - name: Preparation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd

      - name: Download and Setup SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/openwrt-sdk-25.12.3-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget -qO sdk.tar.zst $SDK_URL
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          
          cd sdk
          # 建立软链接 feed
          echo "src-link custom ../netmon-repo" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Compile Packages
        run: |
          cd sdk
          # 1. 生成基础配置，忽略无关报错
          make defconfig || true
          
          # 2. 动态获取插件在 SDK 中的实际路径（防止软链接层级导致硬编码路径失效）
          CORE_TARGET=$(find package -name netmon-core -type d | head -n 1)
          LUCI_TARGET=$(find package -name luci-app-netmon -type d | head -n 1)
          
          echo "Target Found: $CORE_TARGET"
          echo "Target Found: $LUCI_TARGET"

          # 3. 如果路径存在则执行编译
          if [ -n "$CORE_TARGET" ]; then
            make "${CORE_TARGET}/compile" V=s
          else
            echo "Error: netmon-core not found in package directory"
            exit 1
          fi

          if [ -n "$LUCI_TARGET" ]; then
            make "${LUCI_TARGET}/compile" V=s
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netmon-apk-v25.12.3
          # 使用通配符递归查找所有生成的 .apk，避免路径层级微调导致上传失败
          path: sdk/bin/**/*.apk
