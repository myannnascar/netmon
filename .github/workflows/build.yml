name: Build netmon (APK)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: 'netmon-repo' 

      - name: Preparation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd

      - name: Download and Setup SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/openwrt-sdk-25.12.3-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget -qO sdk.tar.zst $SDK_URL
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          
          cd sdk
          # 关键修改：手动强行建立软链接，直接把插件放入 SDK 的 package 目录
          mkdir -p package/custom
          ln -s ../../../netmon-repo/netmon-core package/custom/netmon-core
          ln -s ../../../netmon-repo/luci-app-netmon package/custom/luci-app-netmon
          
          # 更新一下索引，确保 SDK 识别到这两个新加入的包
          ./scripts/feeds update -i
          ./scripts/feeds install -a

      - name: Compile Packages
        run: |
          cd sdk
          # 1. 生成基础配置
          make defconfig || true
          
          # 2. 直接针对手动创建的路径进行编译
          echo "Starting compilation..."
          make package/custom/netmon-core/compile V=s
          make package/custom/luci-app-netmon/compile V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netmon-apk-v25.12.3
          path: sdk/bin/**/*.apk
